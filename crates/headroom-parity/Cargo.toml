[package]
name = "aphrodite-headroom-parity"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust-vs-Python parity harness for the Headroom port."

[lib]
name = "headroom_parity"
path = "src/lib.rs"

[[bin]]
name = "parity-run"
path = "src/bin/parity_run.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
headroom-core = { package = "aphrodite-headroom-core", path = "../headroom-core" }
# NOTE: Phase 0 does not invoke Python from Rust. Phase 1 adds `pyo3` with
# `auto-initialize` here so comparators can call into the installed
# `headroom` package directly.

[features]
default = []
# The Kompress comparator needs `headroom_core::transforms::kompress`, which
# headroom-core gates behind its `ml` feature - and `ml` is default-OFF there
# (fastembed/ort/magika). Forwarding the feature explicitly keeps the fork
# workspace buildable without the ML stack, instead of parity silently
# depending on a gate that is never open: `cargo build` here failed with
# `could not find kompress in transforms` from 2026-08-07 until this feature
# existed. Run the kompress parity leg with
# `cargo run -p aphrodite-headroom-parity --features ml --bin parity-run`.
ml = ["headroom-core/ml"]
